<!doctype html>
<html lang="en">

<head>
  <!-- 文档字符编码设置 -->
  <meta charset="UTF-8" />
  <!-- 网站图标 -->
  <link rel="icon" type="image/jpeg" href="/images/IATA.jpg" />
  <!-- 移动端适配的视口设置 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 页面标题 -->
  <title>ETERM电子客票生成器</title>
  <style>
    /* 加载屏：水墨风背景 + 简洁呼吸动效（去AI化） */
    #loading-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #f9f7f3;
      background-image:
        radial-gradient(900px 600px at 20% 15%, rgba(0, 0, 0, 0.06), transparent 60%),
        radial-gradient(700px 500px at 80% 25%, rgba(0, 0, 0, 0.045), transparent 60%),
        radial-gradient(900px 600px at 50% 80%, rgba(0, 0, 0, 0.05), transparent 60%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
      overflow: hidden;
    }

    #loading-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(620px 420px at 28% 28%, rgba(0, 0, 0, 0.05), transparent 60%),
        radial-gradient(580px 400px at 72% 72%, rgba(0, 0, 0, 0.045), transparent 60%),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.92) 0%, rgba(247, 247, 245, 0.90) 100%);
      opacity: 0.14;
      animation: bg-breathe 12s ease-in-out infinite;
      pointer-events: none;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* 简洁墨滴波纹 */
    .ink-loader {
      width: 72px;
      height: 72px;
      position: relative;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.08) 45%, transparent 60%);
    }

    .ink-loader::before,
    .ink-loader::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.22);
      transform: translate(-50%, -50%);
      opacity: 0.35;
      animation: ripple 2.8s ease-out infinite;
    }

    .ink-loader::after {
      border-color: rgba(0, 0, 0, 0.18);
      animation-delay: 1.4s;
    }

    @keyframes ripple {
      0% { width: 0; height: 0; opacity: 0.35; }
      70% { width: 84px; height: 84px; opacity: 0.10; }
      100% { width: 110px; height: 110px; opacity: 0; }
    }

    @keyframes bg-breathe {
      0%, 100% { opacity: 0.14; }
      50% { opacity: 0.20; }
    }

    .loading-text {
      margin-top: 24px;
      color: #2a2a2a;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1px;
      opacity: 0.8;
      animation: text-breathe 2.8s ease-in-out infinite;
    }

    @keyframes text-breathe {
      0%, 100% { opacity: 0.80; }
      50% { opacity: 1; }
    }
  </style>
</head>

<body>
  <!-- 加载动画屏幕 -->
  <div id="loading-screen">
    <div class="ink-loader"></div>
    <div class="loading-text">加载中…</div>
  </div>

  <!-- React应用程序的根DOM节点 -->
  <div id="root"></div>
  <!-- 应用程序的主入口脚本 -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
