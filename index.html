<!doctype html>
<html lang="en">

<head>
  <!-- 文档字符编码设置 -->
  <meta charset="UTF-8" />
  <!-- 网站图标 -->
  <link rel="icon" type="image/jpeg" href="/images/IATA.jpg" />
  <!-- 移动端适配的视口设置 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 页面标题 -->
  <title>ETERM电子客票生成器</title>
  <style>
    /* 加载动画样式 */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4f6ef7 0%, #667eea 25%, #764ba2 75%, #8e44ad 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 80px;
      height: 80px;
      position: relative;
    }

    .loader-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loader-ring:nth-child(2) {
      border-top-color: rgba(255, 255, 255, 0.5);
      animation-duration: 1.5s;
    }

    .loader-ring:nth-child(3) {
      border-top-color: rgba(255, 255, 255, 0.3);
      animation-duration: 2s;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      margin-top: 30px;
      color: white;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 2px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .loading-dots {
      display: inline-block;
      width: 20px;
      text-align: left;
    }

    @keyframes dots {
      0%, 20% {
        content: '';
      }
      40% {
        content: '.';
      }
      60% {
        content: '..';
      }
      80%, 100% {
        content: '...';
      }
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(1, end) infinite;
    }
  </style>
</head>

<body>
  <!-- 加载动画屏幕 -->
  <div id="loading-screen">
    <div class="loader">
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
    </div>
    <div class="loading-text">
      加载中<span class="loading-dots"></span>
    </div>
  </div>

  <!-- React应用程序的根DOM节点 -->
  <div id="root"></div>
  <!-- 应用程序的主入口脚本 -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
